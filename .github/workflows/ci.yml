# Play the game. That is the test.
#
# A ward of Sparks is the store plane's workload: every Spark is a database, every cycle is
# a commit for each of them, and paying one is a transfer between two databases. So a run
# that holds its invariants is at once a game that works and a store that did not lose
# anything — which is what #10 asked for and had never had.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FDB_VERSION: "7.3.76"
      WEFT_FDB_CLUSTER_FILE: /etc/foundationdb/fdb.cluster
    steps:
      - uses: actions/checkout@v5

      - name: cache FoundationDB packages
        uses: actions/cache@v6
        with:
          path: ~/fdb-debs
          key: fdb-debs-${{ env.FDB_VERSION }}

      - name: Install FoundationDB
        run: |
          mkdir -p ~/fdb-debs
          [ -f ~/fdb-debs/clients.deb ] || curl -fsSL -o ~/fdb-debs/clients.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          [ -f ~/fdb-debs/server.deb ] || curl -fsSL -o ~/fdb-debs/server.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-server_${FDB_VERSION}-1_amd64.deb"
          sudo dpkg -i ~/fdb-debs/clients.deb ~/fdb-debs/server.deb
          for i in $(seq 1 30); do
            fdbcli --exec 'status minimal' | grep -q 'The database is available' && break
            sleep 2
          done
          fdbcli --exec 'status minimal'

      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsqlite3-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j

      # 200 cycles, and the ward has to stay honest through every one of them. The check
      # runs inside each cycle, not only at the end, so a scrip that goes missing is caught
      # in the cycle that lost it rather than two hundred later.
      - name: Play a ward, and hold it to its arithmetic
        run: ./build/queen check 200 20260811 8

      # A second ward with a different seed and more Sparks. Sixteen databases committing
      # every cycle is the commit depth the store plane exists for, and a different seed
      # walks a different path through the same rules.
      - name: Play a larger ward on another seed
        run: ./build/queen check 120 990099 16

      # The Queen must actually get to build something. A run where she never can is a game
      # that balanced itself out of existence, and it would still pass every invariant above
      # — which is exactly the kind of green nobody should trust.
      - name: The ward must have been built
        run: |
          out=$(./build/queen play 150 4242 8)
          echo "$out"
          echo "$out" | grep -q "venues: .*Tavern" || {
            echo "the Queen never commissioned anything in 150 cycles"; exit 1; }
          # And that she decided rather than sorted. `venues:` is in the order she paid, and
          # the Rails cost 260 against the Tavern's 120, so Rails-before-Tavern is an order no
          # sort by price can produce. It fails the moment the planner stops deciding.
          echo "$out" | grep -q "venues:.*Transit Rails.*Cycle's End Tavern" || {
            echo "the Tavern came before the Rails: she is sorting, not planning"; exit 1; }
          # Word gets out, and Sparks arrive. Until the planner landed, the Broadcast Row was
          # five hundred scrip for no effect at all.
          echo "$out" | grep -q "arrived" || {
            echo "the Broadcast Row brought nobody"; exit 1; }

      # A game too large for one subscriber's slice. Sixty Sparks is two wards, and the run
      # moves a Spark between them halfway through. The sum has to hold across both wards,
      # which is the part a migration is able to break, and did on the first attempt.
      - name: A game of two wards, and a Spark that moves between them
        run: |
          set +e
          out=$(./build/queen shard 40 31337 60 2>&1); rc=$?
          set -e
          echo "$out"
          [ "$rc" -eq 0 ] || { echo "the shard run exited $rc"; exit 1; }
          echo "$out" | grep -q "moved to ward 1" || {
            echo "no Spark migrated, so the shard run proved nothing"; exit 1; }
          echo "$out" | grep -q "every ward is honest" || {
            echo "the wards did not add up"; exit 1; }
          echo "$out" | grep -q "no two share a name" || {
            echo "two wards gave out the same wire id, or nobody checked"; exit 1; }

      # One ward may not exceed the slice budget by itself. The refusal is the feature: a
      # ward that quietly exceeded it would drop its venues out of every slice.
      - name: One ward refuses to exceed a slice
        run: |
          if ./build/queen play 5 1 60 2>/dev/null; then
            echo "a 60-Spark ward was allowed, and its venues would fall out of every slice"
            exit 1
          fi
          echo "refused, as it should"
